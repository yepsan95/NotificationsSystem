version: 2.1

orbs:
  python: circleci/python@4.0.0
  coveralls: coveralls/coveralls@2.2.5

jobs:
  lint-and-format:
    executor: python/default
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
      - run:
          name: Run linter (Flake8)
          command: |
            pip install flake8
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run:
          name: Verify code formatting (Black)
          command: |
            pip install black
            black --check .

  run-tests:
    docker:
      - image: cimg/python:3.11
        environment:
          API_PORT: 3000
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: test_notifications_db
          TEST_DB_DOCKER_CONTAINER: test_db_container
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_NAME: test_notifications_db

      - image: cimg/postgres:15.0
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_notifications_db

    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
      - run:
          name: Wait for PostgreSQL
          command: |
            dockerize -wait tcp://127.0.0.1:5432 -timeout 1m
      - run:
          name: Run tests with Pytest
          command: |
            pip install pytest pytest-cov
            pytest -v tests/e2e --cov=. --cov-report=
      - run:
          name: Generate coverage report
          command: |
            coverage lcov -o coverage.lcov
      - coveralls/upload:
          coverage_file: ./coverage.lcov
      - persist_to_workspace:
          root: ~/project
          paths: .

workflows:
  ci-pipeline:
    jobs:
      - lint-and-format
      - run-tests:
          requires:
            - lint-and-format
